<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><style>@font-face{font-family:Silkscreen;src:url(fonts/Silkscreen-Regular.ttf)}@font-face{font-family:Silkscreen;font-weight:700;src:url(fonts/Silkscreen-Bold.ttf)}@font-face{font-family:VT323;src:url(fonts/VT323-Regular.ttf)}</style><title>NEW TAB</title>

<style>
:root{--b:#2f5fe0;--pink:#ffd3ea;--hot:#ff6fb5;--yel:#fff4a8;--mint:#d4f59a;--sky:#d3f1ff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Silkscreen,'Courier New',monospace;color:var(--b);overflow:hidden;
  background-color:#e3f5ff;
  background-image:linear-gradient(#ffffffaa 2px,transparent 2px),linear-gradient(90deg,#ffffffaa 2px,transparent 2px),
                   linear-gradient(180deg,#cdefff 0%,#e4e2ff 55%,#ffd6ec 100%);
  background-size:40px 40px,40px 40px,100% 100%;
  display:flex;align-items:center;justify-content:center}
.win{background:#fff;border:3px solid var(--b);box-shadow:6px 6px 0 #2f5fe066;position:relative}
.bar{height:28px;border-bottom:3px solid var(--b);display:flex;align-items:center;justify-content:flex-end;gap:6px;padding:0 8px;background:var(--pink)}
.bar.y{background:var(--yel)} .bar.m{background:var(--mint)} .bar.s{background:var(--sky)}
.bar .t{margin-right:auto;font-size:13px;font-weight:700}
.btn{width:14px;height:14px;border:2px solid var(--b);background:#fff;font-size:10px;line-height:9px;text-align:center}
.body{padding:22px}
#main{width:min(620px,88vw);z-index:2}
h1{font-size:46px;font-weight:700;text-align:center;letter-spacing:2px;text-shadow:4px 4px 0 var(--hot)}
.sub{text-align:center;font-family:VT323,monospace;font-size:24px;margin:4px 0 18px}
form{display:flex;gap:10px}
input{flex:1;font-family:VT323,monospace;font-size:26px;color:var(--b);padding:8px 12px;border:3px solid var(--b);background:var(--sky);outline:none}
input:focus{background:#fff}
button{font-family:Silkscreen,monospace;font-size:16px;font-weight:700;color:var(--b);background:var(--hot);color:#fff;
  border:3px solid var(--b);padding:0 16px;cursor:pointer;box-shadow:3px 3px 0 var(--b)}
button:active{transform:translate(3px,3px);box-shadow:none}
.load{margin-top:18px;height:20px;border:3px solid var(--b);background:#fff;padding:2px}
.load i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--hot) 0 10px,transparent 10px 14px);
  animation:fill 6s steps(30) infinite}
@keyframes fill{0%{width:0}80%,100%{width:100%}}
.tiles{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:26px}
.tile{display:block;width:120px;text-decoration:none;color:var(--b);background:var(--yel);transition:none}
.tile .bar{height:18px;background:#fff}
.tile .lbl{padding:12px 6px;text-align:center;font-size:13px;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tile:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 #2f5fe066;background:var(--pink)}
.deco{position:absolute;z-index:1;animation:bob 2.4s steps(2) infinite}
.deco .body{padding:14px 18px;text-align:center;font-weight:700}
@keyframes bob{50%{transform:translateY(-6px)}}
.spark{position:absolute;font-size:26px;color:var(--b);animation:blink 1.2s steps(1) infinite;font-family:monospace}
@keyframes blink{50%{opacity:.15}}
.face{font-size:30px;margin:6px 0}
#clock{font-family:VT323,monospace;font-size:34px}
</style><style>@media(max-width:600px){.deco,.spark{display:none}h1{font-size:30px}.sub{font-size:20px}body{overflow:auto;align-items:flex-start;padding-top:8vh}
#main{width:92vw}.tile{width:calc(50% - 8px)}input{font-size:22px;min-width:0}button{padding:0 10px}}</style></head><body>

<div class="win deco" style="left:4%;top:7%;width:200px;background:var(--yel)">
  <div class="bar y" style="background:#fff"><span class="btn">-</span></div>
  <div class="body"><div class="face" style="color:var(--hot)">( ! )</div>WARNING!<br><span style="font-size:11px">too much fun ahead</span></div></div>

<div class="win deco" style="right:5%;top:6%;width:180px;animation-delay:.6s">
  <div class="bar s"><span class="btn">-</span><span class="btn">x</span></div>
  <div class="body"><div id="clock">--:--</div><span style="font-size:11px">LOCAL TIME</span></div></div>

<div class="win deco" style="left:6%;bottom:9%;width:170px;background:var(--sky);animation-delay:1.1s">
  <div class="bar" style="background:#fff"><span class="btn">x</span></div>
  <div class="body"><div class="face">x_x</div>OOPS...</div></div>

<div class="win deco" style="right:6%;bottom:10%;width:200px;animation-delay:.3s">
  <div class="bar s"><span class="btn">-</span><span class="btn">x</span></div>
  <div class="body"><div class="face">[✉]</div>NEW MESSAGE<br><span style="font-size:11px">have a nice day :)</span></div></div>

<div class="win deco" style="left:41%;top:5%;width:130px;background:var(--yel);animation-delay:.9s">
  <div class="bar y" style="background:#fff"></div>
  <div class="body">BE<br>HAPPY</div></div>

<span class="spark" style="left:30%;top:12%">◆</span>
<span class="spark" style="left:72%;top:28%;animation-delay:.4s">✦</span>
<span class="spark" style="left:20%;top:55%;animation-delay:.8s">✕</span>
<span class="spark" style="left:62%;top:88%;animation-delay:.2s">◆</span>
<span class="spark" style="left:40%;top:90%;animation-delay:.6s;color:#ff6fb5">▶▶▶</span>

<div class="win" id="main">
  <div class="bar"><span class="t">DADDY_PIXELS.EXE</span><span class="btn">-</span><span class="btn">□</span><span class="btn">x</span></div>
  <div class="body">
    <h1>DADDY PIXELS</h1>
    <div class="sub">~ surf the web, pixel by pixel ~</div>
    <form onsubmit="go();return false"><input id="q" placeholder="search or type a URL..."><button>GO!</button></form>
    <div class="load"><i></i></div>
    <div class="tiles"><a class="win tile" href="https://duckduckgo.com"><div class="bar"><span class="btn">x</span></div><div class="lbl">DuckDuckGo</div></a><a class="win tile" href="https://m.youtube.com"><div class="bar"><span class="btn">x</span></div><div class="lbl">YouTube</div></a><a class="win tile" href="https://en.m.wikipedia.org"><div class="bar"><span class="btn">x</span></div><div class="lbl">Wikipedia</div></a><a class="win tile" href="https://github.com"><div class="bar"><span class="btn">x</span></div><div class="lbl">GitHub</div></a><a class="win tile" href="daddypixels://carddrop"><div class="bar"><span class="btn">x</span></div><div class="lbl">CARD DROP</div></a></div>
  </div>
</div>

<script>
function go(){let v=document.getElementById('q').value.trim();if(!v)return;
  if(/^https?:\/\//.test(v))location=v;else if(/^[^\s]+\.[a-z]{2,}(\/.*)?$/i.test(v))location='https://'+v;
  else location='https://duckduckgo.com/?q='+encodeURIComponent(v);}
function tick(){document.getElementById('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
tick();setInterval(tick,1000);
</script></body></html>
