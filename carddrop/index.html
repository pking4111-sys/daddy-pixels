  g.gain.setValueAtTime(.0001, s); g.gain.exponentialRampToValueAtTime(vol, s + .015); g.gain.exponentialRampToValueAtTime(.0001, s + dur);

  lfo.frequency.value = 6.5; lg.gain.value = base * .02; lfo.connect(lg); lg.connect(o.frequency);

const fakeEmail = u => u.toLowerCase() + "@players.example.com";
class SupaAPI {
  constructor() { this.sb = supabase.createClient(CFG.url, CFG.key); this.demo = false; }
  async me(u) {
    const {data} = await this.sb.from("profiles").select("username").eq("id", u.id).maybeSingle();
    return {id: u.id, username: data ? data.username : (u.user_metadata || {}).username || "player"};
  }
  async session() { const {data} = await this.sb.auth.getSession(); return data.session ? this.me(data.session.user) : null; }
  async signUp(name, pw) {
    const {data: taken} = await this.sb.from("profiles").select("id").ilike("username", name.replace(/_/g, "\\_"));
    if (taken && taken.length) throw Error("that username is taken");
    const {data, error} = await this.sb.auth.signUp({email: fakeEmail(name), password: pw, options: {data: {username: name}}});
    if (error) throw Error(error.message.includes("registered") ? "that username is taken" : error.message);
    if (!data.session) throw Error("account made, but the server still has 'confirm email' turned on - ask the owner to switch it off");
    return this.me(data.user);
  }
  async signIn(name, pw) {
    const {data, error} = await this.sb.auth.signInWithPassword({email: fakeEmail(name), password: pw});
    if (error) throw Error(/invalid/i.test(error.message) ? "wrong username or password" : error.message);
    return this.me(data.user);
  }
  async signOut() { await this.sb.auth.signOut(); }
  async serverNow() { const {data, error} = await this.sb.rpc("server_now"); if (error) throw error; return Number(data); }
  async claim(slot) { const {data, error} = await this.sb.rpc("claim_card", {p_slot: slot}); if (error) throw Error(error.message); return data; }

    const {data, error} = await this.sb.from("claims").select("slot,user_id,claimed_by,claimer_name,character_id,stars,finish,print_no").eq("drop_id", d);
    if (error) throw error;
    return data.map(c => ({...c, username: c.claimer_name}));
  }
  async myCards(uid) {
    const {data, error} = await this.sb.from("claims").select("id,character_id,stars,finish,print_no,claimed_at").eq("user_id", uid).order("claimed_at", {ascending: false}).limit(1000);
    if (error) throw error; return data;
  }
  async board() { const {data} = await this.sb.from("leaderboard").select("*").limit(25); return data || []; }
  async announcements(since) {
    const {data} = await this.sb.from("announcements").select("*").gt("id", since).order("id", {ascending: true}).limit(20); return data || [];
  }
  async bigPulls() { const {data} = await this.sb.from("announcements").select("*").order("id", {ascending: false}).limit(12); return data || []; }
  async rpc(fn, args) { const {data, error} = await this.sb.rpc(fn, args); if (error) throw Error(error.message); return data; }

  async findPlayer(name) {

  async propose(to, offer, want) {
    const me = this.me(), target = await this.findPlayer(to);
    if (!target) throw Error("there is no player called " + to);
    if (target.id === me.id) throw Error("you can't trade with yourself");
    if (!offer.length && !want.length) throw Error("pick at least one card");
    if (offer.length > 5 || want.length > 5) throw Error("max 5 cards on each side");
    const c = this.all();
    if (!offer.every(id => c.some(x => x.id === id && x.user_id === me.id))) throw Error("you don't own all of those cards any more");
    if (!want.every(id => c.some(x => x.id === id && x.user_id === target.id))) throw Error(to + " doesn't own all of those cards any more");
    const t = this.load("trades", []);
    t.push({id: this.nextId(), from: me.id, to: target.id, offer, want, status: "pending", created_at: Date.now()});
    this.save("trades", t);
  }
  swap(tr) {
    const c = this.all();
    const ok = tr.offer.every(id => c.some(x => x.id === id && x.user_id === tr.from)) && tr.want.every(id => c.some(x => x.id === id && x.user_id === tr.to));
    if (!ok) return "failed";
    c.forEach(x => { if (tr.offer.includes(x.id)) x.user_id = tr.to; else if (tr.want.includes(x.id)) x.user_id = tr.from; });
    this.save("claims", c); return "accepted";
  }
  botThinks(list) {  // PixelBot answers your offers after a couple of seconds
    const c = this.all(), val = ids => ids.reduce((n, id) => n + cardPoints(c.find(x => x.id === id) || {stars: 1, finish: "normal"}), 0);
    for (const tr of list) if (tr.to === "bot" && tr.status === "pending" && Date.now() - tr.created_at > 2500) {
      const fair = tr.want.length === 0 || val(tr.offer) >= val(tr.want) * 0.9;
      tr.status = fair ? this.swap(tr) : "declined"; tr.decided_at = Date.now();
    }
  }
  async respondTrade(id, ok) {
    const t = this.load("trades", []), tr = t.find(x => x.id === id), me = this.me();
    if (!tr || tr.to !== me.id) throw Error("that offer isn't for you");
    if (tr.status !== "pending") throw Error("that offer is already " + tr.status);
    tr.status = ok ? this.swap(tr) : "declined"; tr.decided_at = Date.now(); this.save("trades", t); return tr.status;
  }
  async cancelTrade(id) {
    const t = this.load("trades", []), tr = t.find(x => x.id === id && x.from === this.me().id && x.status === "pending");
    if (!tr) throw Error("that offer can't be cancelled");
    tr.status = "cancelled"; tr.decided_at = Date.now(); this.save("trades", t);
  }
  async trades() {
    const t = this.load("trades", []); this.botThinks(t); this.save("trades", t);
    const me = this.me().id, c = this.all(), cards = ids => ids.map(id => c.find(x => x.id === id)).filter(Boolean);
    return t.filter(x => x.from === me || x.to === me).reverse().slice(0, 30).map(x => ({id: x.id, status: x.status, outgoing: x.from === me,
      from_name: this.nameOf(x.from), to_name: this.nameOf(x.to), offer: cards(x.offer), want: cards(x.want)}));
  }
  // ---- friends + messages
  key(a, b) { return [a, b].sort().join("|"); }
  async social() {
    const me = this.me().id, f = this.load("friends", {});
    for (const k in f) if (k.includes("bot") && f[k].status === "pending") f[k].status = "accepted";   // PixelBot says yes to everyone
    this.save("friends", f);
    const msgs = this.load("msgs", []), t = this.load("trades", []); this.botThinks(t); this.save("trades", t);
    const friends = Object.entries(f).filter(([k]) => k.split("|").includes(me)).map(([k, v]) => {
      const other = k.split("|").find(x => x !== me);
      return {id: other, username: this.nameOf(other), state: v.status === "accepted" ? "friend" : v.by === me ? "outgoing" : "incoming",
        unread: msgs.filter(m => m.from === other && m.to === me && !m.read && m.at <= Date.now()).length};
    });
    return {friends, trades_waiting: t.filter(x => x.to === me && x.status === "pending").length};
  }
  async friendRequest(name) {
    const me = this.me().id, p = await this.findPlayer(name);
    if (!p) throw Error("there is no player called " + name);
    if (p.id === me) throw Error("you can't friend yourself");
    const f = this.load("friends", {}), k = this.key(me, p.id);
    if (f[k]) { if (f[k].status === "accepted") return "already friends"; if (f[k].by === p.id) { f[k].status = "accepted"; this.save("friends", f); return "accepted"; } return "already sent"; }
    f[k] = {status: "pending", by: me}; this.save("friends", f); return "sent";
  }
  async respondFriend(id, ok) {
    const f = this.load("friends", {}), k = this.key(this.me().id, id);
    if (f[k] && f[k].status === "pending" && f[k].by === id) { if (ok) f[k].status = "accepted"; else delete f[k]; }
    this.save("friends", f);
  }
  async removeFriend(id) { const f = this.load("friends", {}); delete f[this.key(this.me().id, id)]; this.save("friends", f); }
  async chat(id) {
    const me = this.me().id, m = this.load("msgs", []);
    m.forEach(x => { if (x.from === id && x.to === me && x.at <= Date.now()) x.read = true; }); this.save("msgs", m);
    return m.filter(x => ((x.from === me && x.to === id) || (x.from === id && x.to === me)) && x.at <= Date.now()).slice(-100)
            .map(x => ({mine: x.from === me, body: x.body, created_at: x.at}));
  }
  async sendMessage(id, body) {
    const me = this.me().id, f = this.load("friends", {})[this.key(me, id)];
    if (!f || f.status !== "accepted") throw Error("you can only message your friends");
    body = body.trim(); if (!body) throw Error("type a message first"); if (body.length > 500) throw Error("messages can be up to 500 characters");
    const m = this.load("msgs", []); m.push({from: me, to: id, body, at: Date.now()});
    if (id === "bot") m.push({from: "bot", to: me, body: BOT_LINES[m.length % BOT_LINES.length], at: Date.now() + 1500});
    this.save("msgs", m);
  }
}

// The numbers here only SHOW things - the server (adventure_setup.sql) does the real maths.
const ADV_BASE = [10, 20, 40, 70, 120, 300];
const cardPower = (stars, finish, lv) => Math.round(ADV_BASE[stars - 1] * (finish === "full" ? 1.3 : finish === "holo" ? 1.15 : 1) * (1 + (lv - 1) * 0.1));
const levelCap = stars => Math.min(100, 40 + 10 * stars);
const stagePower = n => Math.round(40 * Math.pow(1.12, n - 1));
const xpCost = lv => Math.round(10 * Math.pow(lv, 1.6));
const goldCost = lv => Math.round(5 * Math.pow(lv, 1.5));
const RAID_LV = 60;
const RAID_BOSSES = ["KING SLIME", "VOID BAT", "BONE TITAN", "CRYSTAL GOLEM", "PIXEL DRAGON", "NEON KRAKEN",
  "STORM PHOENIX", "GLITCH WYRM", "FROST COLOSSUS", "SHADOW HYDRA", "LAVA BEHEMOTH", "COSMIC LEVIATHAN"];
// a new raid boss every 3 weeks - MUST match raid_season() on the server
const RAID_EPOCH = 1795456800, RAID_SEASON = 1814400;
function raidSeason() {
  const now = Date.now() / 1000 + (S.offset || 0), n = Math.max(0, Math.floor((now - RAID_EPOCH) / RAID_SEASON));
  const start = RAID_EPOCH + n * RAID_SEASON, next = start + RAID_SEASON;
  return {n, boss: n % 12, name: RAID_BOSSES[n % 12], next: next - now, since: now - start, nextName: RAID_BOSSES[(n + 1) % 12]};
}
function raidBanner() {
  const s = raidSeason();
  if (s.next < 48 * 3600) return `<div class="raidban">⚠ NEW RAID BOSS <b>${s.nextName}</b> arrives in <b>${fmtT(s.next)}</b> - get your team ready! (⚔ AFK → RAIDS)</div>`;
  if (s.since < 24 * 3600) return `<div class="raidban new">🐉 <b>${s.name}</b> has arrived! team up and fight it in ⚔ AFK → RAIDS</div>`;
  return "";
}
function raidAlerts() {
  if (!S.user) return;
  const s = raidSeason(), once = (k, msg) => { try { if (localStorage.getItem(k)) return; localStorage.setItem(k, "1"); } catch (e) { return; } toast(msg); try { sparkle(); } catch (e) {} };
  if (s.next < 24 * 3600) once("dp_raidwarn_" + (s.n + 1), `⚠ ${s.nextName} arrives in ${fmtT(s.next)} - get your raid team ready!`);
  if (s.since < 24 * 3600) once("dp_raidnew_" + s.n, `🐉 NEW RAID BOSS: ${s.name} has arrived!`);
}
setInterval(raidAlerts, 60000);
const MONSTERS = ["SLIME", "BAT", "SKULL", "GOLEM", "DRAKE"];
const fmtN = n => Number(n || 0).toLocaleString("en-GB");
const fmtT = s => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? `${h}h ${m}m` : m ? `${m}m ${s % 60}s` : `${s}s`; };

Object.assign(SupaAPI.prototype, {
  async levels(ids) {
    const out = {};
    for (let i = 0; i < ids.length; i += 150) {
      const {data} = await this.sb.from("card_levels").select("claim_id,level,enchant").in("claim_id", ids.slice(i, i + 150));
      (data || []).forEach(r => { out[r.claim_id] = r.level; S.ench[r.claim_id] = r.enchant || 0; });
    }
    return out;
  },
  async myRaids(uid) {
    const {data} = await this.sb.from("raids").select("*").or(`host.eq.${uid},guest.eq.${uid}`).in("status", ["open", "running"]).order("id", {ascending: false}).limit(5);
    return data || [];
  },
  async openRaids(uid) {
    const {data} = await this.sb.from("raids").select("*").eq("status", "open").neq("host", uid).order("id", {ascending: false}).limit(20);
    return data || [];
  }
});

        <div class="hp big"><i style="width:${100 - pct}%"></i></div>
        <div class="small">team power ${fmtN(r.host_power + r.guest_power)} · ${left > 0 ? `${fmtT(left)} left` : "BOSS DEFEATED!"}</div>
        ${left <= 0 && !mine ? `<button class="wide" data-rclaim="${r.id}">CLAIM RAID LOOT (+${fmtN(Math.round((r.host_power + r.guest_power) * 10 * (1 + 0.1 * (r.season || 0))))}🪙 +${fmtN(Math.round((r.host_power + r.guest_power) * 6 * (1 + 0.1 * (r.season || 0))))}✨)</button>` : ""}
        ${mine ? `<div class="small">you took your loot - waiting for your partner</div>` : ""}</div>`;
    }
  }
  const busy = (S.myRaids || []).some(r => r.status === "open" || !(r.host === S.user.id ? r.host_claimed : r.guest_claimed));
  if (!busy) {
    h += `<button class="wide" id="rcreate" ${ready >= 3 ? "" : "disabled"}>START A RAID</button>
      <div class="row"><input id="rcode" placeholder="friend's raid code" maxlength="6"><button id="rjoin" ${ready >= 3 ? "" : "disabled"}>JOIN</button></div>`;
    const open = S.openRaids || [];
    h += `<div class="sec">OPEN RAIDS</div>` + (open.length ? open.map(r => `<div class="offer"><div class="oh"><b>${esc(r.host_name)} vs ${RAID_BOSSES[r.boss] || "BOSS"}</b>
      <span class="st">⚔ ${fmtN(r.host_power)}</span></div><button class="wide alt" data-rjoincode="${esc(r.code)}" ${ready >= 3 ? "" : "disabled"}>JOIN THIS RAID</button></div>`).join("")
      : `<p class="small">no open raids right now - start one!</p>`);
  }
  return h;
}

async function advAct(fn, args, okMsg) {
  try { const r = await S.api.rpc(fn, args); if (okMsg) toast(typeof okMsg === "function" ? okMsg(r) : okMsg); await loadAdventure(); render(); return r; }
  catch (e) { toast(e.message); }
}
function bindAdv() {
  document.querySelectorAll("[data-amode]").forEach(b => b.onclick = async () => { S.advMode = b.dataset.amode; S.picking = null; await loadAdventure().catch(() => {}); render(); });
  if ($("collect")) $("collect").onclick = () => advAct("afk_collect", {}, r => { sparkleOk(); return `+${fmtN(r.got_gold)} 🪙  +${fmtN(r.got_xp)} ✨ collected!`; });
  if ($("editteam")) $("editteam").onclick = () => { S.picking = [...S.adv.team].filter(id => myCard(id)); render(); };
  if ($("cancelteam")) $("cancelteam").onclick = () => { S.picking = null; render(); };
  if ($("saveteam")) $("saveteam").onclick = async () => { const ids = S.picking; S.picking = null; await advAct("afk_set_team", {p_ids: ids}, "team saved! ⚔"); };
  document.querySelectorAll("[data-pid]").forEach(el => el.onclick = () => {
    const id = +el.dataset.pid, i = S.picking.indexOf(id);
    if (i >= 0) S.picking.splice(i, 1); else if (S.picking.length < 5) S.picking.push(id); else return toast("5 cards max - tap one to remove it");
    render();
  });
  document.querySelectorAll("[data-up]").forEach(b => b.onclick = () => advAct("afk_level_up", {p_claim: +b.dataset.up, p_times: +b.dataset.n},
    r => { sparkleOk(); return `LEVEL UP! now Lv ${r.level}`; }));
  document.querySelectorAll("[data-perk]").forEach(b => b.onclick = () => advAct("afk_buy_perk", {p_perk: b.dataset.perk}, r => { sparkleOk(); return "PERK UP! ✨"; }));
  document.querySelectorAll("[data-ench]").forEach(b => b.onclick = () => advAct("afk_enchant", {p_claim: +b.dataset.ench}, r => { sparkleOk(); return `ENCHANTED! ✦ ${r.enchant}/5`; }));
  if ($("rcreate")) $("rcreate").onclick = () => advAct("raid_create", {}, "raid made! send the code to a friend");
  if ($("rjoin")) $("rjoin").onclick = () => advAct("raid_join", {p_code: $("rcode").value}, "you joined the raid! ⚔");
  document.querySelectorAll("[data-rjoincode]").forEach(b => b.onclick = () => advAct("raid_join", {p_code: b.dataset.rjoincode}, "you joined the raid! ⚔"));
  document.querySelectorAll("[data-rcancel]").forEach(b => b.onclick = () => advAct("raid_cancel", {p_id: +b.dataset.rcancel}, "raid cancelled"));
  document.querySelectorAll("[data-rclaim]").forEach(b => b.onclick = () => advAct("raid_claim", {p_id: +b.dataset.rclaim},
    r => { fanfare(0); return `RAID LOOT! +${fmtN(r.gold)} 🪙 +${fmtN(r.xp)} ✨`; }));
  document.querySelectorAll("canvas.raidboss").forEach(cv => drawMonster(cv, +cv.dataset.boss % 5, 99 + +cv.dataset.boss, true));
  startBattle();
}
function sparkleOk() { try { sparkle(); } catch (e) {} }

// ---- pixel monsters (made from the stage number - no pictures needed)
function drawMonster(cv, kind, seed, boss) {
  const W = cv.width, c = cv.getContext("2d"), r = rng(seed * 31 + kind), px = (x, y, w, h, col) => { c.fillStyle = col; c.fillRect(x, y, w, h); };
  c.clearRect(0, 0, W, W);
  const hue = Math.floor(r() * 360), body = `hsl(${hue},70%,${FALLOUT ? 45 : 60}%)`, dark = `hsl(${hue},60%,30%)`, s = W / 48;
  c.save(); c.scale(s, s);
  if (kind === 0) { for (let y = 0; y < 22; y++) { const w = Math.min(40, 14 + y * 2.2); px(24 - w / 2, 22 + y, w, 1, body); } px(8, 42, 32, 2, dark); }
  else if (kind === 1) { px(16, 18, 16, 14, body); for (let i = 0; i < 12; i++) { px(15 - i, 18 + i * 0.6, 1 + i * 0.2, 6 - i * 0.3, dark); px(32 + i, 18 + i * 0.6, 1 + i * 0.2, 6 - i * 0.3, dark); } px(18, 14, 3, 4, body); px(27, 14, 3, 4, body); }
  else if (kind === 2) { px(12, 10, 24, 22, "#f2f2f2"); px(15, 32, 18, 6, "#f2f2f2"); px(15, 18, 7, 7, "#222"); px(26, 18, 7, 7, "#222"); px(22, 27, 4, 3, "#222"); for (const x of [16, 20, 24, 28]) px(x, 34, 2, 4, "#222"); }
  else if (kind === 3) { px(10, 12, 28, 30, body); px(4, 18, 6, 18, dark); px(38, 18, 6, 18, dark); px(14, 42, 8, 4, dark); px(26, 42, 8, 4, dark); px(14, 16, 20, 6, dark); }
  else { px(8, 20, 30, 16, body); px(30, 10, 12, 12, body); px(40, 14, 6, 4, dark); for (let i = 0; i < 8; i++) px(14 + i * 2, 14 - i * 0.5, 2, 6 + i * 0.6, dark); px(4, 30, 6, 4, body); px(12, 36, 5, 8, dark); px(28, 36, 5, 8, dark); }
  if (kind !== 2) { px(kind === 4 ? 34 : 17, kind === 4 ? 13 : 26, 4, 4, "#fff"); px(kind === 4 ? 35 : 18, kind === 4 ? 14 : 27, 2, 2, "#e23b3b");
    if (kind !== 4) { px(27, 26, 4, 4, "#fff"); px(28, 27, 2, 2, "#e23b3b"); } }
  if (boss) { px(16, 2, 16, 4, "#ffd23f"); for (const x of [16, 22, 28]) px(x, 0, 4, 3, "#ffd23f"); }
  c.restore();
}

// ---- the battle you can watch (just for show - the server decides who wins)
let battleTimer = null;
function startBattle() {
  clearInterval(battleTimer);
  const arena = $("arena"); if (!arena || !S.adv) return;
  const a = S.adv, win = a.team_power >= a.stage_power && a.team_power > 0, fighters = [...arena.querySelectorAll(".fighter")];
  let n = 0, hp = 100, dying = false;
  const spawn = () => { hp = 100; dying = false; n++; const kind = (a.stage + n) % 5, boss = (a.stage % 10) === 0;
    drawMonster($("monster"), kind, a.stage * 100 + n, boss); $("mname").textContent = (boss ? "BOSS " : "") + MONSTERS[kind] + " · stage " + a.stage; $("mhp").style.width = "100%"; };
  spawn();
  if (!fighters.length) return;
  battleTimer = setInterval(() => {
    if (!document.body.contains(arena)) return clearInterval(battleTimer);
    if (dying) return;
    const f = fighters[Math.floor(Math.random() * fighters.length)];
    f.classList.remove("hit"); void f.offsetWidth; f.classList.add("hit");
    const dmg = win ? 8 + Math.floor(Math.random() * 14) : 1 + Math.floor(Math.random() * 3);
    hp -= dmg; $("mhp").style.width = Math.max(0, hp) + "%";
    const t = document.createElement("span"); t.className = "dmg"; t.textContent = "-" + Math.round(dmg * a.team_power / 60);
    t.style.left = (62 + Math.random() * 20) + "%"; $("fx").appendChild(t); setTimeout(() => t.remove(), 900);
    if (!win && hp < 70) hp = 100;   // too strong: it heals back up
    if (hp <= 0) { dying = true; $("monster").classList.add("dead"); setTimeout(() => { $("monster").classList.remove("dead"); spawn(); }, 600); }
  }, 650);
}

setInterval(async () => {   // keep the adventure fresh while you watch it
  if (TURBO || S.tab !== "adv" || S.picking || !S.user || Date.now() - (S.advLoaded || 0) < 55000) return;
  try { await loadAdventure(); if (S.tab === "adv" && !S.picking) render(); } catch (e) {}
}, 15000);

async function render(full) {
  const app = $("app");
  if (!S.api) { app.innerHTML = setupView(); return; }
  if (!S.user) { app.innerHTML = authView(); bindAuth(); return; }
  if (S.tab === "drop") { app.innerHTML = shell(dropView()); bindShell(); bindDrop(); }
  if (S.tab === "cards") { if (full) S.mine = await S.api.myCards(S.user.id).catch(() => S.mine); app.innerHTML = shell(cardsView()); bindShell(); bindCards(); }
  if (S.tab === "adv") {
    if (!TURBO && (full || !S.adv)) await loadAdventure().catch(e => toast(e.message));
    app.innerHTML = shell(advView()); bindShell(); bindAdv();
  }
  if (S.tab === "top") { if (full) [S.board, S.bigPulls] = await Promise.all([S.api.board().catch(() => S.board), S.api.bigPulls().catch(() => S.bigPulls)]); app.innerHTML = shell(topView()); bindShell(); }
  if (S.tab === "trade") {
    if (full) {
      [S.mine, S.trades, S.players, S.social] = await Promise.all([S.api.myCards(S.user.id).catch(() => S.mine), S.api.trades().catch(() => S.trades),
        S.api.players().catch(() => S.players), S.api.social().catch(() => S.social)]);
      if (S.tr.target) S.tr.theirs = await S.api.myCards(S.tr.target.id).catch(() => []);
    }
    app.innerHTML = shell(tradeView()); bindShell(); bindTrade();
  }
  if (S.tab === "friends") {
    if (full) { S.social = await S.api.social().catch(() => S.social); if (S.chatWith) S.chat = await S.api.chat(S.chatWith.id).catch(() => S.chat); }
    app.innerHTML = shell(S.chatWith ? chatView() : friendsView()); bindShell(); S.chatWith ? bindChat() : bindFriends();
  }
  paintCards();
}
async function afterLogin() {
  S.social = await S.api.social().catch(() => S.social);
  try { S.offset = (await S.api.serverNow()) - Date.now() / 1000; } catch (e) { S.offset = 0; }
  await refreshDrop(); render(true);
  checkAnnouncements();
}
async function start() {
  try { S.user = await S.api.session(); } catch (e) { S.user = null; }
  if (S.user) await afterLogin(); else render(true);
}

// ------------------------------------------------------------------ global announcements
const annLabel = a => a.stars === 6 ? "✦ SECRET CAT ✦" : `${"★".repeat(a.stars)}${a.finish === "full" ? " FULL ART" : a.finish === "holo" ? " HOLO" : ""}`;
async function checkAnnouncements() {
  if (!S.api) return;
  const key = "dp_ann_seen_" + (S.api.demo ? "demo" : "live");
  if (S.annSeen === null) { try { S.annSeen = +(localStorage.getItem(key) || -1); } catch (e) { S.annSeen = -1; } }
  if (S.annSeen === -1) {   // first time here: don't replay old news
    const recent = await S.api.bigPulls().catch(() => []);
    S.annSeen = recent.length ? Math.max(...recent.map(a => a.id)) : 0;
  }
  const fresh = await S.api.announcements(S.annSeen).catch(() => []);
  if (!fresh.length) { try { localStorage.setItem(key, S.annSeen); } catch (e) {} return; }
  S.annSeen = Math.max(...fresh.map(a => a.id));
  try { localStorage.setItem(key, S.annSeen); } catch (e) {}
  S.annQueue.push(...fresh); showNextAnnouncement();
}
function showNextAnnouncement() {
  if (S.annShowing || !S.annQueue.length) return;
  const a = S.annQueue.shift(); S.annShowing = true;
  const el = document.createElement("div");
  el.className = "ann " + (a.finish === "full" ? "full" : "five");
  el.innerHTML = `<div class="anncard">${cardHTML(a.character_id, a.stars, a.finish, a.print_no)}</div>
    <div class="anntext">📢 <b>${esc(a.username)}</b> pulled<br><b class="big">${annLabel(a)}</b><br>${esc(charInfo(a.character_id).name)} #${a.print_no}</div>`;
  el.onclick = () => el.remove();
  document.body.appendChild(el); paintCards(el); if (a.stars === 6) fanfare(a.character_id - POOL);
  setTimeout(() => { el.classList.add("out"); setTimeout(() => { el.remove(); S.annShowing = false; showNextAnnouncement(); }, 400); }, 6000);
}

// badges every 10 seconds, the open chat every 3 seconds
let socialTicks = 0;
setInterval(async () => {
  if (!S.user || !S.api) return;
  socialTicks++;
  if (S.tab === "friends" && S.chatWith && socialTicks % 3 === 0) {
    const before = S.chat.length, typing = $("msg") ? $("msg").value : "";
    S.chat = await S.api.chat(S.chatWith.id).catch(() => S.chat);
    if (S.chat.length !== before && S.tab === "friends" && S.chatWith) { render(); if ($("msg")) $("msg").value = typing; }
  }
  if (socialTicks % 10 === 0) { S.social = await S.api.social().catch(() => S.social); paintBadges(); }
  if (socialTicks % 8 === 4) checkAnnouncements();
}, 1000);

// tick: update the timer every second, re-check claims every 3 seconds during a drop
let ticks = 0;
setInterval(() => {
  if (!S.user || S.tab !== "drop") return;
  const t = now(), d = Math.floor(t / DROP_EVERY), phase = t - d * DROP_EVERY, active = phase < DROP_WINDOW;
  if (d !== S.lastDrop || (active && ++ticks % 3 === 0)) { refreshDrop(); return; }
  if (Math.abs(phase - DROP_WINDOW) < 1.1) { render(); return; }
  const tm = $("tm"); if (tm) tm.textContent = mmss(active ? DROP_WINDOW - phase : DROP_EVERY - phase);
}, 1000);

window.addEventListener("load", () => {
  if (CONFIGURED && window.supabase) S.api = new SupaAPI();
  else if (CONFIGURED) { $("app").innerHTML = `<div class="win"><div class="pad"><h1>OOPS x_x</h1><p class="small">couldn't load the game. are you online?</p></div></div>`; return; }
  start();
});
